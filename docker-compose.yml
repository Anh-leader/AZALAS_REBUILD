services:
  db:
    image: postgres:16-alpine
    container_name: azalas-db
    environment:
      POSTGRES_USER: azalas
      POSTGRES_PASSWORD: azalas_dev
      POSTGRES_DB: azalas
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - azalas_pg:/var/lib/postgresql/data
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azalas -d azalas"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  azalas_pg:
